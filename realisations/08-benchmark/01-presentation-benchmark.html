<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark la salle de quiz du client — Présentation</title>
<style>
  :root{
    --navy:#252D5D;--navy2:#3C4690;--gold:#F5B301;--ink:#1F2433;--mut:#6B7280;
    --bg:#F4F5F9;--card:#FFFFFF;--line:#E2E4ED;--green:#2E7D46;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#0e1230;color:var(--ink);overflow:hidden}
  /* stage */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;width:min(96vw,1180px);height:min(94vh,664px);background:var(--bg);
         border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;
         opacity:0;transform:translateY(14px) scale(.99);pointer-events:none;transition:opacity .4s,transform .4s;
         padding:48px 56px}
  .slide.on{opacity:1;transform:none;pointer-events:auto}
  .slide.dark{background:linear-gradient(135deg,#252D5D,#31396f 60%,#3C4690)}
  .kick{color:var(--gold);font-weight:700;letter-spacing:2.5px;font-size:13px;text-transform:uppercase;margin-bottom:12px}
  h1.title{color:var(--navy);font-size:32px;font-weight:800;letter-spacing:-.4px;line-height:1.12;max-width:90%}
  .dark h1.title,.dark .big{color:#fff}
  /* cover */
  .cover-sub{color:#c9cfe8;font-size:17px;margin-top:16px;max-width:70%}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(245,179,1,.5);color:#fff;border-radius:20px;
        padding:7px 15px;font-size:13px;font-weight:600}
  .cover-foot{position:absolute;left:56px;bottom:40px;color:#9aa2c4;font-size:13px}
  .cover-orb{position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:rgba(245,179,1,.12)}
  /* cards grid */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 6px 18px rgba(37,45,93,.07)}
  .dot{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .card h3{color:var(--navy);font-size:17px;margin-bottom:8px}
  .card p{color:#454d61;font-size:13px;line-height:1.5}
  /* two col */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
  .col h3{color:var(--navy);font-size:17px;margin-bottom:10px}
  .col.excl h3{color:#B0452F}
  ul.clean{list-style:none} ul.clean li{position:relative;padding-left:22px;margin-bottom:10px;font-size:14.5px;color:#3b4254;line-height:1.45}
  ul.clean li::before{content:"";position:absolute;left:0;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .col.excl ul.clean li::before{background:#B0452F}
  .relia{margin-top:26px;background:#EEF0F6;border:1px solid var(--line);border-radius:12px;padding:18px 22px;font-size:13.5px;color:#3b4254;line-height:1.5}
  .relia b{color:var(--navy)}
  /* chart slide */
  .chartwrap{display:flex;gap:26px;margin-top:22px;height:400px}
  .chart{flex:1.5;display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--line);padding-top:20px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar{width:100%;max-width:60px;border-radius:7px 7px 0 0;background:var(--navy2);position:relative;min-height:3px}
  .bar.k{background:var(--gold)}
  .bar .v{position:absolute;top:-22px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;color:var(--ink)}
  .bl{margin-top:8px;font-size:11px;color:var(--mut);text-align:center;font-weight:600;line-height:1.15;height:28px}
  .bl b{color:var(--navy)}
  .side{flex:1;display:flex;flex-direction:column;gap:16px}
  .cbox{background:var(--navy);color:#fff;border-radius:14px;padding:18px 20px}
  .cbox .s{color:#c9cfe8;font-size:12.5px} .cbox .b{font-size:30px;font-weight:800;color:var(--gold);margin:2px 0}
  .cbox.small{background:#fff;color:#3b4254;border:1px solid var(--line)}
  .cbox.small h4{color:var(--navy);font-size:14px;margin-bottom:8px}
  .cbox.small li{font-size:11.8px;margin-bottom:6px;list-style:none;padding-left:14px;position:relative}
  .cbox.small li::before{content:"–";position:absolute;left:0;color:var(--gold);font-weight:800}
  /* table slide */
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
  th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:12.5px}
  th.c{text-align:center}
  td{padding:9px 12px;border-bottom:1px solid var(--line)} td.c{text-align:center;font-weight:700}
  tr.k{background:#FFF7E0} tr.k td:first-child{font-weight:800;color:var(--navy)}
  .zt{font-size:11px;color:var(--navy2);font-weight:700}
  .cap{margin-top:14px;font-size:12px;color:var(--mut);font-style:italic}
  /* 30 min */
  .split{display:grid;grid-template-columns:1fr 1.15fr;gap:30px;margin-top:24px;align-items:start}
  .hero{background:var(--navy);border-radius:16px;padding:30px;color:#fff;text-align:center}
  .hero .lab{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:12px}
  .hero .big{font-size:74px;font-weight:800;line-height:1;margin:14px 0 6px}
  .hero .u{color:#c9cfe8;font-size:14px}
  .compcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px}
  .compcard h4{color:var(--navy);font-size:14.5px} .compcard p{color:#454d61;font-size:12.5px;margin-top:3px}
  .emph{font-style:italic;color:var(--navy);font-size:13.5px;margin-top:6px;line-height:1.45}
  /* reco slide */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .rcard{background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .rcard .dot{margin-bottom:12px}
  .rcard h3{color:var(--navy);font-size:16.5px;margin-bottom:10px;min-height:44px}
  .rcard p{color:#454d61;font-size:12.8px;line-height:1.5}
  .rcaveat{margin-top:22px;background:var(--navy2);border-radius:12px;padding:16px 22px;color:#e7e9f4;font-size:13px;line-height:1.5}
  .rcaveat b{color:var(--gold)}
  /* sources */
  .srow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);
        border-radius:10px;padding:14px 20px;margin-bottom:12px}
  .srow .a{font-weight:700;color:var(--navy);font-size:14px} .srow .b{color:#454d61;font-size:12.5px}
  .srow .c{color:var(--navy2);font-size:12px;font-weight:600}
  /* footer strip */
  .foot{position:absolute;left:56px;bottom:22px;font-size:11px;color:var(--mut)}
  .dark .foot{color:#9aa2c4}
  /* nav */
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:20}
  .nav button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;
              font-size:17px;cursor:pointer;transition:.15s;backdrop-filter:blur(4px)}
  .nav button:hover{background:var(--gold);color:var(--navy)}
  .dots{display:flex;gap:8px}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.15s}
  .dots i.on{background:var(--gold);transform:scale(1.25)}
  .counter{position:fixed;top:18px;right:24px;color:rgba(255,255,255,.75);font-size:13px;font-weight:600;z-index:20}
  .progress{position:fixed;top:0;left:0;height:4px;background:var(--gold);z-index:30;transition:width .4s}
  .hint{position:fixed;top:18px;left:24px;color:rgba(255,255,255,.5);font-size:12px;z-index:20}
  @media(max-width:720px){.slide{padding:26px 22px}.grid4,.grid3{grid-template-columns:1fr 1fr}.chartwrap{flex-direction:column;height:auto}.split,.cols{grid-template-columns:1fr}}
</style>
</head>
<body><div style="background:#8A6210;color:#fff;padding:10px 16px;font:600 13px/1.5 system-ui,sans-serif;text-align:center">Version de diffusion — les enseignes concurrentes et les liens de source ont été anonymisés. Prix, durées, méthode et analyses sont ceux du document d'origine.</div>
<div class="progress" id="prog"></div>
<div class="hint">← → pour naviguer</div>
<div class="counter"><span id="cur">1</span> / 8</div>
<div class="stage" id="stage"></div>
<div class="nav">
  <button id="prev">‹</button>
  <div class="dots" id="dots"></div>
  <button id="next">›</button>
</div>

<script>
const gold="#F5B301",navy="#252D5D",navy2="#3C4690",green="#2E7D46";
function bars(data,key){
  const max=28;
  return `<div class="chart">`+data.map(d=>{
    const v=d[key];const h=v==null?16:Math.max(6,(v/max)*100);
    return `<div class="bcol"><div class="bar${d.k?' k':''}" style="height:${h}%"><div class="v">${v==null?'n.c.':v+'€'}</div></div>
      <div class="bl">${d.k?'<b>'+d.s+'</b>':d.s}</div></div>`;
  }).join("")+`</div>`;
}
const chartData=[
 {s:"A — Lorient",petit:24,k:false},{s:"A — Rennes",petit:24},{s:"QR St-Brieuc",petit:24},
 {s:"Buzz Brain",petit:20},{s:"Enseigne C",petit:20},{s:"A — Vannes",petit:20},
 {s:"la salle de quiz du client",petit:18,k:true},{s:"A — Fougères",petit:17}
];
const foot='Benchmark prix · Quiz / Buzzer Bretagne vs la salle de quiz du client — Le client · 25/06/2026';

const slides=[
/* 1 COVER */
`<section class="slide dark">
  <div class="cover-orb"></div>
  <div class="kick">Benchmark prix</div>
  <h1 class="title">Le la salle de quiz du client face au marché<br>du quiz en Bretagne</h1>
  <p class="cover-sub">Comparateur de prix par personne et par session — comparables directs du la salle de quiz du client — dans la zone de Crevin et en Bretagne.</p>
  <div class="chips"><span class="chip">30 min &amp; 1 heure</span><span class="chip">Grilles dégressives</span><span class="chip">Rural vs grandes villes</span><span class="chip">Sources officielles</span></div>
  <div class="cover-foot">Établi le 25 juin 2026 · Document interne d'aide à la décision</div>
</section>`,
/* 2 EN BREF */
`<section class="slide">
  <div class="kick">En bref</div>
  <h1 class="title">4 constats qui ressortent du marché</h1>
  <div class="grid4">
    <div class="card"><div class="dot" style="background:${navy}">01</div><h3>Marché 1 h à 20 €</h3><p>Tarif d'entrée le plus fréquent des concurrents : 20 €/pers. Fourchette 15 € à 28 €.</p></div>
    <div class="card"><div class="dot" style="background:${green}">02</div><h3>Le la salle de quiz du client n'est pas cher</h3><p>Ton 1 h : 18 € (4-6 j) → 15 € (10-12 j). Dans le bas de la fourchette, sous le pack à 20-24 €.</p></div>
    <div class="card"><div class="dot" style="background:${gold}">03</div><h3>Seul sur le 30 min</h3><p>Aucun concurrent ne vend de session courte autonome. Ton 30 min à 10 € est unique.</p></div>
    <div class="card"><div class="dot" style="background:${navy2}">04</div><h3>Aucun quiz rural</h3><p>Pas de salle de quiz autour de Crevin. Tu n'es pas concurrencé par moins cher localement.</p></div>
  </div>
  <div class="foot">${foot}</div>
</section>`,
/* 3 METHODE */
`<section class="slide">
  <div class="kick">Périmètre &amp; méthode</div>
  <h1 class="title">Ce qui est comparé — et ce qui ne l'est pas</h1>
  <div class="cols">
    <div class="col"><h3>Inclus — comparables directs</h3>
      <ul class="clean"><li>Salles de quiz / buzzer, décor « plateau TV »</li><li>Prix TTC par personne, par session</li><li>Formats 30 min &amp; 1 h, grilles dégressives complètes</li><li>Bretagne, priorité autour de Crevin</li></ul></div>
    <div class="col excl"><h3>Exclus</h3>
      <ul class="clean"><li>Quiz de bar, blind tests animés, pub quizzes</li><li>Villes hors Bretagne (Paris, Marseille…)</li><li>New Jump : « buzzer » = arrivée d'un parcours, pas un quiz</li></ul></div>
  </div>
  <div class="relia"><b>Fiabilité — </b>rien n'est inventé. Prix relevés sur les sites officiels (25/06/2026). Enseigne A publie une grille par ville qui varie. Deux limites : paliers de Enseigne B non publics (seul 20 € chiffré) ; tarifs la salle de quiz du client communiqués par la direction. Durée : « 1 h » Kampus ≈ 45 min, « 1 h » Enseigne A = 1h-1h10.</div>
  <div class="foot">${foot}</div>
</section>`,
/* 4 CHART */
`<section class="slide">
  <div class="kick">Le marché en 1 coup d'œil</div>
  <h1 class="title">Tarif 1 heure — petit groupe (≈ 4-6 joueurs)</h1>
  <div class="chartwrap">
    ${bars(chartData,"petit")}
    <div class="side">
      <div class="cbox"><div class="s">Grands groupes (10-12 j)</div><div class="b">15 €</div><div class="u">la salle de quiz du client tombe au niveau des moins chers du marché (Fougères, Vannes en semaine).</div></div>
      <div class="cbox small"><h4>À lire avec prudence</h4>
        <li>Enseigne B : « dès 20 € » (paliers non publiés)</li>
        <li>Enseigne C &amp; A — Vannes : prix heure pleine / week-end ; 15 € en creux / semaine</li>
        <li>Durée : la salle de quiz du client 1 h ≈ 45 min ; Enseigne A 1h-1h10</li></div>
    </div>
  </div>
  <div class="foot">${foot}</div>
</section>`,
/* 5 TABLE */
`<section class="slide">
  <div class="kick">Comparateur détaillé</div>
  <h1 class="title">Grilles 1 heure — du moins cher au plus cher</h1>
  <table>
    <tr><th>Enseigne</th><th>Zone (≈ Crevin)</th><th class="c">Petit groupe</th><th class="c">Grand groupe</th><th class="c">30 min</th><th>À noter</th></tr>
    <tr class="k"><td>Le client — salle de quiz</td><td><span class="zt">Rural — Crevin</span></td><td class="c">18 € (4-6 j)</td><td class="c">15 € (10-12 j)</td><td class="c"><b style="color:#b8860b">10 €</b></td><td>≈45 min · +30 min à 10 €</td></tr>
    <tr><td>Enseigne A — Fougères</td><td><span class="zt">Semi-rural (35)</span></td><td class="c">17 € (4-18 j)</td><td class="c">15 € (30+ j)</td><td class="c">—</td><td>le moins cher</td></tr>
    <tr><td>Enseigne A — Vannes</td><td><span class="zt">Ville moy. (56)</span></td><td class="c">20 € (WE)</td><td class="c">15 € (semaine)</td><td class="c">—</td><td>pas dégressif par groupe</td></tr>
    <tr><td>Enseigne C</td><td><span class="zt">Ville moy. (56)</span></td><td class="c">20 € (HP)</td><td class="c">15 € (HC)</td><td class="c">—</td><td>par âge + HP/HC</td></tr>
    <tr><td>Enseigne B</td><td><span class="zt">Gde ville (35)</span></td><td class="c">dès 20 €</td><td class="c">dégressif</td><td class="c">—</td><td>paliers non publiés</td></tr>
    <tr><td>Enseigne A — Rennes</td><td><span class="zt">Gde ville (35)</span></td><td class="c">24 € (3-5 j)</td><td class="c">20 € (6-18 j)</td><td class="c">—</td><td>1h30 : 28-32 €</td></tr>
    <tr><td>Enseigne A — Saint-Brieuc</td><td><span class="zt">Ville moy. (22)</span></td><td class="c">24 € (3-6 j)</td><td class="c">20 € (7-18 j)</td><td class="c">—</td><td>enfant 18 €</td></tr>
    <tr><td>Enseigne A — Lorient</td><td><span class="zt">Ville moy. (56)</span></td><td class="c">24 € (4-5 j)</td><td class="c">20 € (6-18 j)</td><td class="c">—</td><td>28 € pour 3 joueurs</td></tr>
  </table>
  <div class="cap">Prix par personne. « Petit groupe » = prix le plus élevé ; « grand groupe » = prix dégressif le plus bas.</div>
  <div class="foot">${foot}</div>
</section>`,
/* 6 30 MIN */
`<section class="slide">
  <div class="kick">Format court</div>
  <h1 class="title">30 minutes : un terrain où tu es seul</h1>
  <div class="split">
    <div class="hero"><div class="lab">KAMPUS — KWIZZ</div><div class="big">10 €</div><div class="u">par personne · session ~25 min (4 manches)</div><div class="u" style="margin-top:10px">Toutes tailles de groupe · jusqu'à 12 j · dès 8 ans</div></div>
    <div>
      <div class="compcard"><h4>Enseigne A (toutes villes)</h4><p>Pas de session 30 min autonome. Option « 3ᵉ partie +30 min » ajoutée à une 1 h : +8 € (+6 € à Fougères).</p></div>
      <div class="compcard"><h4>Enseigne B — Rennes</h4><p>1 heure uniquement.</p></div>
      <div class="compcard"><h4>Enseigne C — Vannes</h4><p>1 heure uniquement.</p></div>
      <p class="emph">Tu ne peux pas être jugé « trop cher » sur le 30 min : personne d'autre ne le propose. C'est un argument de différenciation.</p>
    </div>
  </div>
  <div class="foot">${foot}</div>
</section>`,
/* 7 RECO */
`<section class="slide dark">
  <div class="kick">Conseils &amp; remarques</div>
  <h1 class="title">Avant de baisser les prix : 3 pistes sur l'existant</h1>
  <div class="grid3">
    <div class="rcard"><div class="dot" style="background:${gold}">1</div><h3>Ne pas brader</h3><p>Tu es déjà dans le bas du marché (15-18 € vs 20-24 €). Baisser éroderait la marge sans lever le vrai frein. Le prix n'est pas le problème prioritaire.</p></div>
    <div class="rcard"><div class="dot" style="background:${green}">2</div><h3>Capitaliser sur tes 2 atouts uniques</h3><p>Le 30 min à 10 € = produit d'appel que personne n'a. Le dégressif (15 € à 10-12 j) = argument groupes / B2B / CSE / anniversaires sur créneaux creux — la salle de quiz du client privatisable 12 pers.</p></div>
    <div class="rcard"><div class="dot" style="background:${navy2}">3</div><h3>Visibilité &amp; expérience</h3><p>Enseigne A gagne par la notoriété (St-Brieuc 1 096 avis, Rennes 700+) et l'immersion « plateau TV ». Page/réservation la salle de quiz du client dédiée + animation soignée + collecte d'avis.</p></div>
  </div>
  <div class="rcaveat"><b>À valider avant d'agir :</b> ces pistes sont des hypothèses. Croise-les avec tes données la salle de quiz du client (remplissage par créneau, panier, origine clients). Sans elles, on ne sait pas si le frein est la demande, la visibilité ou l'expérience — mais pas le prix.</div>
</section>`,
/* 8 SOURCES */
`<section class="slide">
  <div class="kick">Annexe</div>
  <h1 class="title">Sources &amp; fiabilité</h1>
  <div style="margin-top:24px">
    <div class="srow"><div class="a">Enseigne A (Rennes, Lorient, St-Brieuc, Vannes, Fougères)</div><div class="b">Sites officiels par ville — grilles dégressives</div><div class="c">quiz-room.com</div></div>
    <div class="srow"><div class="a">Enseigne B (Vezin-le-Coquet)</div><div class="b">Site officiel + Office de Tourisme de Rennes</div><div class="c">[site officiel de l'enseigne]</div></div>
    <div class="srow"><div class="a">Enseigne C (Séné / Vannes)</div><div class="b">Site officiel — grille âge × heures pleines/creuses</div><div class="c">buzzparty.fr</div></div>
    <div class="srow"><div class="a">Le client — salle de quiz</div><div class="b">Site officiel + tarifs communiqués par la direction</div><div class="c">kampus137.fr</div></div>
  </div>
  <div class="cap">Périmètre : Bretagne / zone de Crevin. Prix TTC par personne et par session relevés le 25/06/2026. « Non publié » = donnée non communiquée — aucune valeur estimée.</div>
  <div class="foot">${foot}</div>
</section>`
];

const stage=document.getElementById("stage");
stage.innerHTML=slides.join("");
const els=[...document.querySelectorAll(".slide")];
const dots=document.getElementById("dots");
els.forEach((_,i)=>{const d=document.createElement("i");d.onclick=()=>go(i);dots.appendChild(d);});
const dotEls=[...dots.children];
let idx=0;
function go(n){
  idx=Math.max(0,Math.min(els.length-1,n));
  els.forEach((s,i)=>s.classList.toggle("on",i===idx));
  dotEls.forEach((d,i)=>d.classList.toggle("on",i===idx));
  document.getElementById("cur").textContent=idx+1;
  document.getElementById("prog").style.width=((idx+1)/els.length*100)+"%";
}
document.getElementById("next").onclick=()=>go(idx+1);
document.getElementById("prev").onclick=()=>go(idx-1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")go(idx+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")go(idx-1);
  else if(e.key==="Home")go(0);else if(e.key==="End")go(els.length-1);
});
stage.addEventListener("click",e=>{ if(e.target.closest(".nav")||e.target.closest("a"))return;
  const x=e.clientX, mid=window.innerWidth/2; go(idx+(x>mid?1:-1)); });
go(0);
</script>
</body>
</html>
