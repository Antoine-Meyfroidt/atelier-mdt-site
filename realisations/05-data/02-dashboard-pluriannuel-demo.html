  const rowsHtml=DATA.mois.filter(m=>m.moyenne.ca_net).map(m=>{
    const a26=m.annees['2026'];
    return `<tr><td>${MN[m.mois]}</td><td class="tnum">${eur0(m.moyenne.ca_net)}</td><td class="tnum">${eur0(m.moyenne.ca_min)} – ${eur0(m.moyenne.ca_max)}</td><td class="tnum">${num(m.moyenne.tickets)}</td><td class="tnum">${num(m.moyenne.visiteurs)}</td><td class="tnum">${m.moyenne.panier.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</td><td class="tnum">${m.moyenne.anniv_fetes}</td><td class="tnum">${a26?eur0(a26.ca_net):'—'}</td><td class="tnum ${a26?(a26.ca_net>=m.moyenne.ca_net?'up':'down'):''}">${a26?pct((a26.ca_net-m.moyenne.ca_net)/m.moyenne.ca_net):'—'}</td></tr>`;
  }).join('');
  view('sais',`
    <div class="card col12" style="margin-bottom:16px">
      <h2>Profil saisonnier — CA net moyen par mois (2023-2025)</h2>
      <div class="cap">Barres = moyenne 3 ans · moustaches = min-max · points orange = réalisé 2026.</div>
      <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Moyenne 23-25</span><span><span class="sw" style="background:var(--y26)"></span>2026</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CA moyen par mois">${svg}</svg>
      <div class="note">Deux saisons hautes : l'hiver-vacances (févr, déc) et l'automne (oct) ; l'été (juil-août, ouverture 7j/7) ; creux structurels : mai, juin, sept. Janv et mars dépendent du placement des vacances.</div>
    </div>
    <div class="card col12">
      <h2>Mois types — moyennes 2023-2025</h2>
      <div class="cap">Référentiel : cliquer un mois dans la barre de navigation pour sa fiche détaillée.</div>
      <div class="tablewrap"><table>
        <tr><th>Mois</th><th>CA net moyen</th><th>Fourchette</th><th>Tickets</th><th>Visiteurs</th><th>Panier</th><th>Fêtes anniv</th><th>2026 réalisé</th><th>2026 vs moy.</th></tr>
        ${rowsHtml}
      </table></div>
    </div>`,true);
})();

/* ---------- Fiches mois type ---------- */
DATA.mois.forEach(m=>{
  const avg=m.moyenne;
  if(!avg.ca_net){view('m'+m.mois,`<div class="card"><h2>${MN[m.mois]}</h2><div class="cap">Pas de données de référence.</div></div>`);return;}
  const years=[2023,2024,2025,2026].filter(y=>m.annees[String(y)]);
  const maxY=Math.max(...years.map(y=>m.annees[String(y)].ca_net));
  const yearBars=years.map(y=>{
    const a=m.annees[String(y)];
    return `<div class="row"><div class="rl">${y}${y===2026?' ←':''}</div><div class="track"><div class="fill" style="width:${Math.max(2,100*a.ca_net/maxY)}%;background:${YCOL[y]}"></div></div><div class="rv tnum">${eurK(a.ca_net)}</div></div>`;
  }).join('');
  const cats=Object.keys(avg.cat).filter(k=>avg.cat[k]>0).sort((a,b)=>avg.cat[b]-avg.cat[a]);
  const maxC=Math.max(...cats.map(k=>avg.cat[k]));
  const catBars=cats.map(k=>`<div class="row"><div class="rl">${CATLABEL[k]}</div><div class="track"><div class="fill" style="width:${Math.max(2,100*avg.cat[k]/maxC)}%"></div></div><div class="rv tnum">${eurK(avg.cat[k])} <small>${Math.round(100*avg.cat[k]/avg.ca_net)}%</small></div></div>`).join('');
  const a26=m.annees['2026'];
  view('m'+m.mois,`
    <div class="kpis">
      <div class="kpi"><div class="k">CA net moyen (23-25)</div><div class="v tnum">${eur0(avg.ca_net)}</div><div class="e" style="color:var(--muted)">${avg.nb_ref} années réf.</div></div>
      <div class="kpi"><div class="k">Fourchette</div><div class="v tnum" style="font-size:15px;line-height:1.8">${eurK(avg.ca_min)} – ${eurK(avg.ca_max)}</div></div>
      <div class="kpi"><div class="k">Tickets moyens</div><div class="v tnum">${num(avg.tickets)}</div></div>
      <div class="kpi"><div class="k">Visiteurs moyens</div><div class="v tnum">${num(avg.visiteurs)}</div></div>
      <div class="kpi"><div class="k">Panier moyen</div><div class="v tnum">${avg.panier.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</div></div>
      <div class="kpi"><div class="k">Fêtes anniv (moy.)</div><div class="v tnum">${avg.anniv_fetes}</div><div class="e" style="color:var(--muted)">${eurK(avg.anniv_ca)}</div></div>
    </div>
    <div class="grid">
      <div class="card col6">
        <h2>${MN[m.mois]} — année par année</h2>
        <div class="cap">CA net réalisé chaque année.${a26?` 2026 : <b class="${a26.ca_net>=avg.ca_net?'up':'down'}">${pct((a26.ca_net-avg.ca_net)/avg.ca_net)} vs moyenne</b>.`:''}</div>
        <div class="rows">${yearBars}</div>
        <div class="note">Jours d'ouverture moyens : ${avg.jours} · CA/jour ouvré moyen : ${eur0(avg.ca_jour)}</div>
      </div>
      <div class="card col6">
        <h2>Mix moyen par catégorie</h2>
        <div class="cap">Structure type du CA d'un mois de ${MN[m.mois].toLowerCase()} (moyenne 23-25).</div>
        <div class="rows">${catBars}</div>
      </div>
    </div>`);
});

/* ---------- Vues annuelles ---------- */
DATA.annees.forEach(a=>{
  const prev=DATA.annees.find(p=>p.annee===a.annee-1);
  let compHtml='';
  if(prev){
    const common=a.mensuel.map(x=>x.m).filter(mm=>prev.mensuel.some(p=>p.m===mm));
    const sumA=a.mensuel.filter(x=>common.includes(x.m)).reduce((s,x)=>s+x.ca,0);
    const sumP=prev.mensuel.filter(x=>common.includes(x.m)).reduce((s,x)=>s+x.ca,0);
    const f=(sumA-sumP)/sumP;
    compHtml=`<div class="e ${f>=0?'up':'down'}">${pct(f)} vs ${prev.annee} à périmètre égal (${common.length} mois)</div>`;
  }
  const W=1120,H=260,pT=24,pB=34,pL=52,pR=8;
  const allCA=a.mensuel.map(x=>x.ca);
  const maxCA=Math.max(...allCA)*1.12;
  const y=v=>pT+(H-pT-pB)*(1-v/maxCA);
  const bw=(W-pL-pR)/12;
  let svg='';
  for(let g=0;g<=3;g++){const gv=maxCA*g/3;svg+=`<line x1="${pL}" y1="${y(gv)}" x2="${W-pR}" y2="${y(gv)}" style="stroke:var(--grid)"/><text x="${pL-6}" y="${y(gv)+4}" text-anchor="end" font-size="10.5" style="fill:var(--faint)">${eurK(gv)}</text>`;}
  for(let mm=1;mm<=12;mm++){
    const x=pL+(mm-1)*bw;
    const d=a.mensuel.find(z=>z.m===mm);
    if(d){svg+=`<rect x="${x+bw*0.2}" y="${y(d.ca)}" width="${bw*0.6}" height="${y(0)-y(d.ca)}" rx="4" style="fill:${YCOL[a.annee]}"/><text x="${x+bw/2}" y="${y(d.ca)-6}" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--muted)">${eurK(d.ca)}</text>`;}
    svg+=`<text x="${x+bw/2}" y="${H-pB+15}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${MA[mm]}</text>`;
  }
  const sorted=[...a.mensuel].sort((x,z)=>z.ca-x.ca);
  const top3=sorted.slice(0,3), flop3=sorted.slice(-3).reverse();
  const cats=Object.keys(a.cat).filter(k=>a.cat[k]>0).sort((x,z)=>a.cat[z]-a.cat[x]);
  const maxC=Math.max(...cats.map(k=>a.cat[k]));
  const catBars=cats.map(k=>`<div class="row"><div class="rl">${CATLABEL[k]}</div><div class="track"><div class="fill" style="width:${Math.max(2,100*a.cat[k]/maxC)}%"></div></div><div class="rv tnum">${eurK(a.cat[k])} <small>${Math.round(100*a.cat[k]/a.ca_net)}%</small></div></div>`).join('');
  view('y'+a.annee,`
    <div class="kpis">
      <div class="kpi"><div class="k">CA net ${a.annee}${a.nb_mois<12?' ('+a.nb_mois+' mois)':''}</div><div class="v tnum">${eurK(a.ca_net)}</div>${compHtml}</div>
      <div class="kpi"><div class="k">Tickets</div><div class="v tnum">${num(a.tickets)}</div></div>
      <div class="kpi"><div class="k">Visiteurs</div><div class="v tnum">${num(a.visiteurs)}</div></div>
      <div class="kpi"><div class="k">Panier moyen</div><div class="v tnum">${a.panier.toLocaleString('fr-FR',{minimumFractionDigits:2})} €</div></div>
      <div class="kpi"><div class="k">Fêtes d'anniversaire</div><div class="v tnum">${num(a.anniv_fetes)}</div><div class="e" style="color:var(--muted)">${eurK(a.anniv_ca)}</div></div>
      <div class="kpi"><div class="k">Jours ouverts</div><div class="v tnum">${num(a.jours)}</div></div>
    </div>
    <div class="card col12" style="margin-bottom:16px">
      <h2>${a.annee} — CA net mois par mois</h2>
      <div class="cap">${a.nb_mois<12?'Année partielle : '+a.nb_mois+' mois couverts.':'Année complète.'}</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="CA mensuel ${a.annee}">${svg}</svg>
    </div>
    <div class="grid">
      <div class="card col6">
        <h2>Mix par catégorie</h2>
        <div class="cap">Structure du CA ${a.annee}.</div>
        <div class="rows">${catBars}</div>
      </div>
      <div class="card col6">
        <h2>Meilleurs / plus faibles mois</h2>
        <div class="cap">CA net ${a.annee}.</div>
        <div class="rows">
          ${top3.map((x,i)=>`<div class="row"><div class="rl">🏆 ${MN[x.m]}</div><div class="track"><div class="fill" style="width:${100*x.ca/sorted[0].ca}%;background:var(--pos)"></div></div><div class="rv tnum">${eurK(x.ca)}</div></div>`).join('')}
          ${flop3.map(x=>`<div class="row"><div class="rl">▽ ${MN[x.m]}</div><div class="track"><div class="fill" style="width:${Math.max(2,100*x.ca/sorted[0].ca)}%;background:var(--neg)"></div></div><div class="rv tnum">${eurK(x.ca)}</div></div>`).join('')}
        </div>
        <div class="note">Panier moyen ${a.annee} : ${a.panier.toLocaleString('fr-FR',{minimumFractionDigits:2})} € · ${num(a.visiteurs)} visiteurs sur ${num(a.jours)} jours ouverts.</div>
      </div>
    </div>`);
});
</script>
